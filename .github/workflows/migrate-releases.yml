name: Copy Water Wave Lab release archives
on: workflow_dispatch
permissions:
  contents: write
concurrency: waterwave-release-migration
jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/migrate-waterwave-releases.py download
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python .github/migrate-waterwave-releases.py copy
        env:
          GH_TOKEN: ${{ github.token }}
